# Prometheus config — Google Cloud (GCP VM)
# Scrapes the metrics ports of the Azure and Oracle machines, plus the
# platforms (Render) exporters, and sends the alert feed to the Failover Controller.

global:
  scrape_interval: 5s        # fast decision loop for a live demo
  evaluation_interval: 5s

rule_files:
  - rules/alerts.yml

scrape_configs:
  # ==== cloud Azure (primary) ====
  - job_name: azure-node            # CPU / memory / load (node_exporter)
    static_configs: [{ targets: ["<AZURE_TS_IP>:9100"] }]

  - job_name: azure-services        # Kafka lag, offsets, ingestion
    static_configs: [{ targets: ["<AZURE_TS_IP>:9700", "<AZURE_TS_IP>:9710"] }]

  # ==== cloud Oracle (standby) ====
  - job_name: oracle-node
    static_configs: [{ targets: ["<ORACLE_TS_IP>:9100"] }]

  - job_name: oracle-services
    static_configs: [{ targets: ["<ORACLE_TS_IP>:9700", "<ORACLE_TS_IP>:9710"] }]

  # ==== self ====
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

alerting:
  alertmanagers: []                 # alerts flow straight to the controller via /api/v1/query
