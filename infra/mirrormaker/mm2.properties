# Kafka MirrorMaker 2 — continuous Azure ↔ Oracle sync
# Runs on the GCP VM (Failover Manager), directed at the two Kafka clusters.
#
# Two-way mirroring with recertainment, ready to demonstrate a resync with
# zero data loss when Azure comes back.

clusters = azure, oracle

azure.bootstrap.servers = <AZURE_TS_IP>:9092
oracle.bootstrap.servers = <ORACLE_TS_IP>:9092

# ==== Azure -> Oracle ====
azure->oracle.enabled = true
azure->oracle.topics = vote_reports|aggregated_results|anomalies
azure->oracle.groups = .*
azure->oracle.sync.topic.acls = false
azure->oracle.offset-syncs.topic.location = target

# ==== Oracle -> Azure (idle while azure is healthy; used after failover) ====
oracle->azure.enabled = true
oracle->azure.topics = vote_reports|aggregated_results|anomalies
oracle->azure.groups = .*
oracle->azure.sync.topic.acls = false
oracle->azure.offset-syncs.topic.location = target

# topic prefix on remote cluster, ex. on oracle: azure.vote_reports
replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
munge-back-topics.enabled = false

# replication checks: small intervals, so the failover demo is visual
azure->oracle.producer.enable.idempotence = true
azure->oracle.producer.max.request.size = 1048576
tasks.max = 8
