# Prometheus config — runs on azure-1 (the supervision VM in the group's official
# architecture). Scrapes the metrics ports of azure-1 itself; Oracle targets are
# added as soon as oracle-1 exists (the machine is in account verification).

global:
  scrape_interval: 5s        # fast decision loop for a live demo
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  # ==== cloud Azure (primary) — local targets on azure-1 ====
  - job_name: azure-node            # CPU / memory / load (node_exporter)
    static_configs: [{ targets: ["localhost:9100"] }]

  - job_name: azure-relay           # kafka_relay metrics (services on the VM)
    static_configs: [{ targets: ["localhost:9730"] }]

  # ==== cloud Oracle (standby) — add when oracle-1 exists ====
  # - job_name: oracle-node
  #   static_configs: [{ targets: ["<ORACLE_TS_IP>:9100"] }]
  #
  # - job_name: oracle-relay
  #   static_configs: [{ targets: ["<ORACLE_TS_IP>:9730"] }]

  # ==== self ====
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

alerting:
  alertmanagers: []                 # alerts flow straight to the controller via /api/v1/query
